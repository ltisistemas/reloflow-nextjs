name: 🔄 Feature → Develop PR

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check if PR exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq length)
          echo "pr_exists=$PR_EXISTS" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: ✨ Create PR to develop
        if: steps.check-pr.outputs.pr_exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.check-pr.outputs.branch_name }}
          PR_BODY: |
            ## 📋 Descrição

            Automática PR gerada pela branch `${{ steps.check-pr.outputs.branch_name }}`

            ### 🔗 Principais mudanças
            - Aguardando revisão da equipe

            ### ✅ Checklist
            - [ ] Código revisado
            - [ ] Testes passando
            - [ ] Sem conflitos
        run: |
          gh pr create \
            --base develop \
            --head $BRANCH_NAME \
            --title "✨ Merge $BRANCH_NAME into develop" \
            --body "$PR_BODY" \
            --label "type:feature" \
            --draft=false
